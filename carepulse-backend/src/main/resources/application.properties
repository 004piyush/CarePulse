spring.application.name=carepulse-backend

# Server
server.port = 8080

# MySql
spring.datasource.url=jdbc:mysql://localhost:3306/carepulse_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username = root
spring.datasource.password = admin@1234
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql = true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

# JWT Configuration
carepulse.jwt.secret=${JWT_SECRET:d8fbdff2f59e4048807b5ce7ee653dfe4df2322944af0b6b6b55107b5cb43c16}
carepulse.jwt.expiration = 86400000

# LOGGING is the practice of recording runtime events, action, status messages and errors that happens while and application runs
logging.level.org.springframework.security = DEBUG
logging.level.org.springframework.sql = DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder = TRACE
